{{define "content"}}
<div class="catalog-layout">
    <aside class="sidebar">
        <h3>Categories</h3>
        <ul class="category-list">
            <li><a href="/" class="{{if not .Category}}active{{end}}">All</a></li>
            {{range .Categories}}
            <li><a href="/?category={{.Slug}}" class="{{if eq $.Category .Slug}}active{{end}}">{{.Name}}</a></li>
            {{end}}
        </ul>
    </aside>
    <div class="catalog-main">
        <h1>{{if .Query}}Search: "{{.Query}}"{{else}}All Products{{end}}</h1>
        <div id="product-grid">
            {{template "product_grid.html" .}}
        </div>
    </div>
</div>
{{end}}
