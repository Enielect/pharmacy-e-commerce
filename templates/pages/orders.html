{{define "content"}}
<h1>My Orders</h1>
{{if .Orders}}
<div class="orders-list">
    {{range .Orders}}
    <div class="order-card">
        <div class="order-header">
            <span class="order-id">Order #{{.ID}}</span>
            <span class="order-date">{{.CreatedAt.Format "Jan 02, 2006"}}</span>
            <span class="order-status status-{{.Status}}">{{.Status}}</span>
            <span class="order-total">₦{{centsToDollars .TotalCents}}</span>
        </div>
        <a href="/orders/{{.ID}}" class="btn btn-secondary btn-sm">View Details</a>
    </div>
    {{end}}
</div>
{{else}}
<p>You have no orders yet. <a href="/">Start shopping</a></p>
{{end}}
{{end}}
