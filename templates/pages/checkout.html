{{define "content"}}
<h1>Checkout</h1>
<div class="checkout-layout">
    <div class="checkout-form">
        <h2>Shipping Address</h2>
        <form method="post" action="/checkout">
            <div class="form-group">
                <label>Address Line 1</label>
                <input type="text" name="address_line1" required class="form-control">
            </div>
            <div class="form-group">
                <label>City</label>
                <input type="text" name="address_city" required class="form-control">
            </div>
            <div class="form-group">
                <label>State</label>
                <input type="text" name="address_state" required class="form-control">
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="tel" name="address_phone" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary">Place Order</button>
        </form>
    </div>
    <div class="checkout-summary">
        <h2>Order Summary</h2>
        {{if .Cart.Items}}
        <ul class="summary-items">
            {{range .Cart.Items}}
            <li>
                <span>{{.ProductName}} - {{.Strength}} {{.PackSize}} x{{.Quantity}}</span>
                <span>₦{{centsToDollars (mul .PriceCents .Quantity)}}</span>
            </li>
            {{end}}
        </ul>
        <div class="summary-total">
            <strong>Total: ₦{{centsToDollars .Cart.TotalCents}}</strong>
        </div>
        {{end}}
    </div>
</div>
{{end}}
